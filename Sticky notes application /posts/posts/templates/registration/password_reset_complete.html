{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete – Sticky Notes</title>
    <link rel="stylesheet" href="{% static 'sticky_notes/css/styles.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card {
            background: #fff8a6;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 10px; }
        .auth-card h1 { font-size: 1.4rem; margin-bottom: 12px; }
        .auth-card p { color: #555; font-size: 0.95rem; margin-bottom: 20px; }
        .auth-card .btn { display: inline-block; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="icon">✅</div>
        <h1>Password Changed!</h1>
        <p>Your password has been set successfully. You can now log in with your new password.</p>
        <a class="btn" href="{% url 'login' %}">Go to Login</a>
    </div>
</body>
</html>
