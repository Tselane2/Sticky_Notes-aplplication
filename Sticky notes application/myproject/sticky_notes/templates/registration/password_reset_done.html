{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent – Sticky Notes</title>
    <link rel="stylesheet" href="{% static 'sticky_notes/css/styles.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card {
            background: #fff8a6;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 10px; }
        .auth-card h1 { font-size: 1.4rem; margin-bottom: 12px; }
        .auth-card p { color: #555; font-size: 0.95rem; line-height: 1.5; margin-bottom: 10px; }
        .auth-card .btn { display: inline-block; margin-top: 20px; }
        .note-box {
            background: #fffde0;
            border: 1px solid #f0e040;
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 16px;
            font-size: 0.85rem;
            color: #666;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="icon">📬</div>
        <h1>Check your email</h1>
        <p>If an account exists with that address, we've sent a password reset link. Check your inbox (and spam folder).</p>
        <div class="note-box">
            <strong>Running locally?</strong> The reset link is printed to the Django App console logs — check the workflow output.
        </div>
        <a class="btn" href="{% url 'login' %}">Back to Login</a>
    </div>
</body>
</html>
