{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Sticky Notes</title>
    <link rel="stylesheet" href="{% static 'sticky_notes/css/styles.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card {
            background: #fff8a6;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .auth-card h1 { text-align: center; margin-bottom: 10px; font-size: 1.5rem; }
        .auth-card p.subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .auth-card label { display: block; font-weight: bold; margin: 12px 0 4px; }
        .auth-card input[type="email"] {
            width: 100%; padding: 8px 10px; border: 1px solid #ccc;
            border-radius: 5px; font-size: 0.95rem; box-sizing: border-box;
        }
        .auth-card input:focus { outline: none; border-color: #4CAF50; }
        .auth-card .actions { margin-top: 20px; }
        .auth-card .actions .btn { width: 100%; text-align: center; display: block; }
        .auth-footer { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #555; }
        .auth-footer a { color: #4CAF50; text-decoration: none; font-weight: bold; }
        .errorlist { color: #e63946; font-size: 0.82rem; list-style: none; padding: 0; margin: 4px 0; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>🔑 Reset Password</h1>
        <p class="subtitle">Enter your email and we'll send you a reset link.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<ul class="errorlist">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
            {% endfor %}
            <div class="actions">
                <button class="btn" type="submit">Send Reset Link</button>
            </div>
        </form>
        <p class="auth-footer"><a href="{% url 'login' %}">← Back to login</a></p>
    </div>
</body>
</html>
