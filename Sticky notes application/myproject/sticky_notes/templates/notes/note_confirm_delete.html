{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Note</title>
    <link rel="stylesheet" href="{% static 'sticky_notes/css/styles.css' %}">
    <style>
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff8a6;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        nav span { font-weight: bold; color: #555; }
        nav a.back { background: #555; color: white; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-size: 0.85rem; }
        nav a.back:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <nav>
        <span>👤 {{ request.user.username }}</span>
        <a class="back" href="{% url 'note_list' %}">← My Notes</a>
    </nav>

    <h1>🗑️ Delete Note</h1>

    <div class="confirm-card">
        <p>Are you sure you want to delete <strong>"{{ note.title }}"</strong>? This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <button class="btn-danger" type="submit">Yes, Delete</button>
                <a class="btn-secondary" href="{% url 'note_list' %}">Cancel</a>
            </div>
        </form>
    </div>

    <script src="{% static 'sticky_notes/js/main.js' %}"></script>
</body>
</html>
